      <script>
        window.toast = function() {
          return {
            visible: false,
            message: '',
            type: 'success',
            show(message, type = 'success') {
              this.message = message;
              this.type = type;
              this.visible = true;
              setTimeout(() => {
                this.visible = false;
              }, 3000);
            }
          }
        }
