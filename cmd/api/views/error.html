{{template "header" .}}

<div class="bg-gray-100 dark:bg-gray-900 flex items-center justify-center" style="height: calc(100vh - 120px);">
  <div class="text-center">
    <h1 class="text-6xl font-bold text-blue-600 dark:text-blue-500">{{.StatusCode}}</h1>
    <h2 class="text-2xl font-semibold text-gray-800 dark:text-gray-200 mt-4">{{.StatusText}}</h2>
    <p class="text-gray-600 dark:text-gray-400 mt-2">{{.Message}}</p>
    <a href="/dashboard" class="mt-6 inline-block px-6 py-3 text-white bg-blue-600 rounded-md hover:bg-blue-700">
      대시보드로 돌아가기
    </a>
  </div>
</div>

{{template "footer" .}}
