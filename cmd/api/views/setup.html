<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <script defer src="/static/js/tailwindcss.js"></script>
  <script defer src="/static/js/alpine.min.js"></script>
  <script src="/static/js/common.js"></script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center">
  <div class="max-w-2xl w-full space-y-8 p-8">
    <!-- 로고 및 제목 -->
    <div class="text-center">
      <div class="mx-auto w-16 h-16 bg-blue-600 rounded-lg flex items-center justify-center mb-4">
        <span class="text-white font-bold text-2xl">T</span>
      </div>
      <h2 class="text-3xl font-bold text-gray-900 dark:text-white">tmiDB 초기 설정</h2>
      <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">시스템을 처음 사용하기 위한 설정을 완료하세요</p>
    </div>

    <!-- 설정 폼 -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6" x-data="setupForm()">
      <form @submit.prevent="submitSetup()">
        <div class="space-y-6">
          <!-- 관리자 계정 설정 -->
          <div>
            <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-4">관리자 계정 설정</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label for="admin_username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                  관리자 사용자명
                </label>
                <input x-model="form.admin_username" type="text" id="admin_username" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white" placeholder="admin">
              </div>
              <div>
                <label for="admin_password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                  관리자 비밀번호
                </label>
                <input x-model="form.admin_password" type="password" id="admin_password" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white" placeholder="안전한 비밀번호를 입력하세요">
              </div>
            </div>
          </div>

          <!-- 기본 조직 설정 -->
          <div>
            <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-4">기본 조직 설정</h3>
            <div>
              <label for="org_name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                조직명
              </label>
              <input x-model="form.organization_name" type="text" id="org_name" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white" placeholder="기본 조직">
            </div>
          </div>

          <!-- 진행 상황 표시 -->
          <div x-show="loading" class="text-center py-4">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="mt-2 text-sm text-gray-600 dark:text-gray-400" x-text="loadingMessage">설정 중...</p>
          </div>

          <!-- 에러 메시지 -->
          <div x-show="error" class="p-3 bg-red-100 dark:bg-red-900 border border-red-400 dark:border-red-600 text-red-700 dark:text-red-200 rounded-md text-sm" x-text="error"></div>

          <!-- 성공 메시지 -->
          <div x-show="success" class="p-3 bg-green-100 dark:bg-green-900 border border-green-400 dark:border-green-600 text-green-700 dark:text-green-200 rounded-md text-sm">
            <p x-text="success"></p>
            <div x-show="adminToken" class="mt-2">
              <p class="font-bold">Admin API Token:</p>
              <code class="text-xs bg-gray-200 dark:bg-gray-700 p-2 rounded block break-all" x-text="adminToken"></code>
              <p class="text-xs mt-1">이 토큰은 다시 볼 수 없으니 안전한 곳에 보관하세요.</p>
            </div>
          </div>
        </div>

        <!-- 설정 버튼 -->
        <div class="mt-8">
          <button type="submit" :disabled="loading || !isFormValid()" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
            <span x-show="!loading">초기 설정 완료</span>
            <span x-show="loading" class="flex items-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span x-text="loadingMessage"></span>
            </span>
          </button>
        </div>
      </form>
    </div>

    <!-- 시스템 정보 -->
    <div class="text-center text-xs text-gray-500 dark:text-gray-400">
      <p>tmiDB v1.0 - Target-Speaker-Listener Database</p>
      <p class="mt-1">초기 설정은 한 번만 수행됩니다. 설정 완료 후에는 관리자 계정으로 로그인하여 추가 설정을 진행하세요.</p>
    </div>
  </div>

  <script>
    function setupForm() {
      return {
        loading: false,
        error: '',
        success: '',
        loadingMessage: '설정 중...',
        adminToken: '',
        form: {
          admin_username: 'admin',
          admin_password: '',
          organization_name: 'Default Organization',
        },

        isFormValid() {
          return this.form.admin_username &&
            this.form.admin_password &&
            this.form.organization_name;
        },

        async submitSetup() {
          if (!this.isFormValid()) {
            this.error = '모든 필수 필드를 입력하세요.';
            return;
          }

          this.loading = true;
          this.error = '';
          this.success = '';
          this.adminToken = '';
          this.loadingMessage = '시스템 초기 설정 진행 중...';

          try {
            const response = await apiCall('/api/setup/organization', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(this.form)
            });

            const data = response.data;

            if (response.success && data.success) {
              this.success = '초기 설정이 완료되었습니다. 잠시 후 로그인 페이지로 이동합니다.';
              this.loadingMessage = '설정 완료!';
              this.adminToken = data.admin_token;

              // 5초 후 로그인 페이지로 리디렉션
              setTimeout(() => {
                window.location.href = '/login';
              }, 5000);
            } else {
              this.error = data.error?.message || '설정 중 오류가 발생했습니다.';
            }
          } catch (error) {
            console.error('Setup error:', error);
            this.error = '네트워크 오류가 발생했습니다.';
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>

</html>
