{{template "header" .}}

<div x-data="dashboardData()" x-init="init()" class="space-y-6">
  <!-- 페이지 헤더 -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h2 class="text-2xl font-bold text-gray-900 dark:text-white">{{if .PageTitle}}{{.PageTitle}}
        {{else}}Dashboard{{end}}
      </h2>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Target-Speaker-Listener 데이터 관리 플랫폼</p>
    </div>
    <div class="mt-4 sm:mt-0 flex items-center space-x-3">
      <div class="flex items-center space-x-2 text-sm text-gray-500 dark:text-gray-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span x-text="lastUpdated">방금 전</span>
      </div>
      <button @click="refreshData()" :disabled="loading" class="inline-flex items-center px-3 py-2 border border-gray-300 dark:border-gray-600 shadow-sm text-sm leading-4 font-medium rounded-md text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50">
        <svg class="w-4 h-4 mr-2" :class="{ 'animate-spin': loading }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        새로고침
      </button>
    </div>
  </div>

  <!-- 조직 개요 (관리자만) -->
  <div x-show="organizations && organizations.length > 0 && '{{.User.Role}}' === 'admin'" class="mb-6">
    <h3 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">조직 개요</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      <template x-for="org in organizations" :key="org.org_id">
        <div @click="switchOrganization(org.org_id)" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 cursor-pointer hover:shadow-lg hover:border-blue-500 dark:hover:border-blue-500 transition-all">
          <div class="flex items-center justify-between mb-4">
            <h4 class="text-lg font-semibold text-gray-900 dark:text-white" x-text="org.name"></h4>
            <div class="w-4 h-4 rounded-full" :style="`background-color: ${getOrgColor(org.org_id)}`"></div>
          </div>
          <div class="space-y-3 text-sm">
            <div class="flex justify-between">
              <span class="text-gray-500 dark:text-gray-400">사용자</span>
              <span class="font-medium text-gray-900 dark:text-white" x-text="org.user_count"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-500 dark:text-gray-400">데이터 수</span>
              <span class="font-medium text-gray-900 dark:text-white" x-text="formatNumber(org.data_count)"></span>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- 시스템 상태 & 활동 -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- 시스템 리소스 -->
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-xl font-semibold text-gray-900 dark:text-white">시스템 리소스</h3>
        <div class="flex items-center space-x-2 text-sm text-gray-500 dark:text-gray-400">
          <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
          <span>실시간</span>
        </div>
      </div>

      <div class="space-y-6">
        <!-- CPU -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <span class="text-sm font-medium text-gray-700 dark:text-gray-300">CPU</span>
            <div class="text-right">
              <span class="text-sm text-gray-600 dark:text-gray-400" x-text="resources.cpu.usage + '%'">-</span>
              <div class="text-xs text-gray-500 dark:text-gray-500" x-text="resources.cpu.cores + ' 코어 @ ' + resources.cpu.frequency">-</div>
            </div>
          </div>
          <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2">
            <div class="bg-blue-600 h-2 rounded-full transition-all duration-500" :style="`width: ${resources.cpu.usage}%`"></div>
          </div>
        </div>

        <!-- 메모리 -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <span class="text-sm font-medium text-gray-700 dark:text-gray-300">메모리</span>
            <div class="text-right">
              <span class="text-sm text-gray-600 dark:text-gray-400" x-text="resources.memory.usage + '%'">-</span>
              <div class="text-xs text-gray-500 dark:text-gray-500" x-text="resources.memory.used + 'GB / ' + resources.memory.total + 'GB'">-</div>
            </div>
          </div>
          <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2">
            <div class="bg-green-600 h-2 rounded-full transition-all duration-500" :style="`width: ${resources.memory.usage}%`"></div>
          </div>
        </div>

        <!-- 디스크 -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <span class="text-sm font-medium text-gray-700 dark:text-gray-300">디스크</span>
            <div class="text-right">
              <span class="text-sm text-gray-600 dark:text-gray-400" x-text="resources.disk.usage + '%'">-</span>
              <div class="text-xs text-gray-500 dark:text-gray-500" x-text="resources.disk.used + 'GB / ' + resources.disk.total + 'GB'">-</div>
            </div>
          </div>
          <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2">
            <div class="bg-yellow-600 h-2 rounded-full transition-all duration-500" :style="`width: ${resources.disk.usage}%`"></div>
          </div>
        </div>

        <!-- 네트워크 -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <span class="text-sm font-medium text-gray-700 dark:text-gray-300">네트워크</span>
            <div class="text-right text-xs text-gray-500 dark:text-gray-500">
              <div>↓ <span x-text="resources.network.rx + ' Mbps'">-</span></div>
              <div>↑ <span x-text="resources.network.tx + ' Mbps'">-</span></div>
            </div>
          </div>
          <div class="flex space-x-2">
            <div class="flex-1 bg-gray-200 dark:bg-gray-700 rounded-full h-1">
              <div class="bg-blue-500 h-1 rounded-full transition-all duration-500" :style="`width: ${Math.min(resources.network.rx * 2, 100)}%`"></div>
            </div>
            <div class="flex-1 bg-gray-200 dark:bg-gray-700 rounded-full h-1">
              <div class="bg-red-500 h-1 rounded-full transition-all duration-500" :style="`width: ${Math.min(resources.network.tx * 2, 100)}%`"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 최근 활동 -->
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6">
      <h3 class="text-xl font-semibold text-gray-900 dark:text-white mb-6">최근 활동</h3>
      <div class="space-y-4">
        <template x-for="activity in activities" :key="activity.id">
          <div class="flex items-start space-x-3">
            <div class="w-2 h-2 rounded-full mt-2" :class="activity.type === 'success' ? 'bg-green-500' : activity.type === 'warning' ? 'bg-yellow-500' : 'bg-blue-500'"></div>
            <div class="flex-1">
              <p class="text-sm text-gray-900 dark:text-white" x-text="activity.message">-</p>
              <p class="text-xs text-gray-500 dark:text-gray-400" x-text="activity.time">-</p>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- API 통계 차트 -->
  <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6">
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-xl font-semibold text-gray-900 dark:text-white">API 호출 통계</h3>
      <div class="flex items-center space-x-2">
        <button @click="chartPeriod = '1h'" :class="chartPeriod === '1h' ? 'bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'" class="px-3 py-1 text-sm rounded-md">1시간</button>
        <button @click="chartPeriod = '6h'" :class="chartPeriod === '6h' ? 'bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'" class="px-3 py-1 text-sm rounded-md">6시간</button>
        <button @click="chartPeriod = '24h'" :class="chartPeriod === '24h' ? 'bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'" class="px-3 py-1 text-sm rounded-md">24시간</button>
      </div>
    </div>
    <div class="h-64">
      <canvas id="apiChart" class="w-full h-full"></canvas>
    </div>
  </div>

  <script>
    window.dashboardData = function() {
      const orgId = window.currentOrgId;
      return {
        loading: false,
        lastUpdated: '방금 전',
        chartPeriod: '1h',
        chart: null,
        organizations: [],
        resources: {
          cpu: {
            usage: 0,
            cores: 0,
            frequency: ''
          },
          memory: {
            usage: 0,
            used: 0,
            total: 0
          },
          disk: {
            usage: 0,
            used: 0,
            total: 0
          },
          network: {
            rx: 0,
            tx: 0
          }
        },
        activities: [],
        init() {
          this.refreshData();
          this.initChart();
          setInterval(() => {
            this.refreshData();
          }, 30000);
        },
        async refreshData() {
          this.loading = true;
          try {
            await Promise.all([
              this.loadOrganizations(),
              this.loadResources(),
              this.loadActivities()
            ]);
            this.lastUpdated = new Date().toLocaleTimeString('ko-KR');
          } catch (error) {
            console.error('데이터 로드 실패:', error);
          } finally {
            this.loading = false;
          }
        },
        async loadOrganizations() {
          if ('{{.User.Role}}' !== 'admin') {
            this.organizations = [];
            return;
          }
          try {
            const response = await window.apiCall('/api/manage/organizations');
            if (response.success && response.organizations) {
              this.organizations = response.organizations;
            } else {
              this.organizations = [];
            }
          } catch (e) {
            console.error('Failed to load organizations', e);
            this.organizations = [];
          }
        },
        async loadResources() {
          this.resources = {
            cpu: {
              usage: 42,
              cores: 4,
              frequency: '2.4 GHz'
            },
            memory: {
              usage: 68,
              used: 10.9,
              total: 16
            },
            disk: {
              usage: 45,
              used: 225.5,
              total: 500
            },
            network: {
              rx: 12.3,
              tx: 8.7
            }
          };
        },
        async loadActivities() {
          this.activities = [{
              id: 1,
              type: 'success',
              message: '새로운 데이터가 수집되었습니다',
              time: '2분 전'
            },
            {
              id: 2,
              type: 'success',
              message: '시스템 백업이 완료되었습니다',
              time: '15분 전'
            },
            {
              id: 3,
              type: 'info',
              message: 'API 토큰이 갱신되었습니다',
              time: '30분 전'
            },
            {
              id: 4,
              type: 'warning',
              message: '디스크 사용량이 70%를 초과했습니다',
              time: '1시간 전'
            }
          ];
        },
        async initChart() {
          if (typeof window.Chart === 'undefined') {
            console.error('Chart.js가 로드되지 않았습니다.');
            return;
          }
          if (this.chart) {
            this.chart.destroy();
          }
          const canvas = document.getElementById('apiChart');
          if (!canvas) {
            console.error('apiChart canvas를 찾을 수 없습니다.');
            return;
          }
          const ctx = canvas.getContext('2d');
          this.chart = new window.Chart(ctx, {
            type: 'line',
            data: {
              labels: ['00:00', '01:00', '02:00', '03:00', '04:00', '05:00'],
              datasets: [{
                label: 'API 호출 수',
                data: [120, 190, 300, 500, 200, 300],
                borderColor: 'rgb(59, 130, 246)',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                tension: 0.4,
                fill: true
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  display: false
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  grid: {
                    color: 'rgba(156, 163, 175, 0.2)'
                  }
                },
                x: {
                  grid: {
                    color: 'rgba(156, 163, 175, 0.2)'
                  }
                }
              }
            }
          });
        },
        getOrgColor(orgId) {
          const colors = ['#3B82F6', '#10B981', '#8B5CF6', '#F59E0B', '#EF4444', '#6366F1'];
          let hash = 0;
          if (!orgId) return colors[0];
          for (let i = 0; i < orgId.length; i++) {
            hash = orgId.charCodeAt(i) + ((hash << 5) - hash);
          }
          return colors[Math.abs(hash) % colors.length];
        },
        formatNumber(num) {
          if (!num) return '0';
          if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
          else if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
          return num.toString();
        },
        switchOrganization(orgId) {
          window.location.href = `/organization/${orgId}`;
        }
      }
    }
    window.refreshPageData = function() {
      const dashboardComponent = document.querySelector('[x-data*="dashboardData"]');
      if (
        dashboardComponent &&
        dashboardComponent.__x &&
        dashboardComponent.__x.$data &&
        typeof dashboardComponent.__x.$data.refreshData === 'function'
      ) {
        dashboardComponent.__x.$data.refreshData();
      }
    }
  </script>
</div>

{{template "footer" .}}
