{{template "header" .}}

<div x-data="listenersData()" x-init="init()" class="space-y-6">

  <!-- 페이지 헤더 -->
  <div class="flex items-center justify-between">
    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">리스너 관리</h2>
    <div class="mt-4 sm:mt-0">
      <button @click="showCreateModal = true" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        새 리스너
      </button>
    </div>
  </div>

  <!-- 필터 및 검색 -->
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">검색</label>
        <input x-model="filters.search" @input="applyFilters" type="text" placeholder="리스너 이름 검색..." class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">상태</label>
        <select x-model="filters.status" @change="applyFilters" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
          <option value="">전체</option>
          <option value="active">활성</option>
          <option value="inactive">비활성</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">카테고리</label>
        <select x-model="filters.category" @change="applyFilters" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
          <option value="">전체 카테고리</option>
          <template x-for="category in categories" :key="category.category_name">
            <option :value="category.category_name" x-text="category.category_name"></option>
          </template>
        </select>
      </div>
    </div>
  </div>

  <!-- 리스너 목록 -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <template x-for="listener in filteredListeners" :key="listener.listener_id">
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-6 hover:shadow-lg transition-shadow">
        <div class="flex items-start justify-between">
          <div class="flex-1">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white" x-text="listener.category_name"></h3>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400" x-text="listener.description || '설명 없음'"></p>

            <div class="mt-4 space-y-2">
              <div class="flex items-center text-sm">
                <span class="text-gray-500 dark:text-gray-400">상태:</span>
                <span x-show="listener.is_active" class="ml-2 px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200">
                  활성
                </span>
                <span x-show="!listener.is_active" class="ml-2 px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-300">
                  비활성
                </span>
              </div>
              <div class="text-sm text-gray-500 dark:text-gray-400">
                생성일: <span x-text="window.formatDate(listener.created_at)"></span>
              </div>
            </div>
          </div>

          <div class="ml-4">
            <button @click="toggleListenerStatus(listener)" :class="listener.is_active ? 'bg-gray-200 dark:bg-gray-700' : 'bg-blue-600'" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
              <span :class="listener.is_active ? 'translate-x-5' : 'translate-x-0'" class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
            </button>
          </div>
        </div>

        <div class="mt-6 flex items-center justify-between">
          <button @click="viewListener(listener)" class="text-sm text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-300">
            상세보기
          </button>
          <div class="flex items-center space-x-2">
            <button @click="editListener(listener)" class="text-sm text-indigo-600 hover:text-indigo-800 dark:text-indigo-400 dark:hover:text-indigo-300">
              수정
            </button>
            <button @click="deleteListener(listener)" class="text-sm text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300">
              삭제
            </button>
          </div>
        </div>
      </div>
    </template>
  </div>

  <div x-show="filteredListeners.length === 0" class="text-center py-12">
    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
    </svg>
    <h3 class="mt-2 text-sm font-medium text-gray-900 dark:text-white">리스너가 없습니다</h3>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">새 리스너를 생성하여 데이터 수집을 시작하세요.</p>
  </div>

  <!-- 생성/수정 모달 -->
  <div x-show="showCreateModal || showEditModal" x-cloak class="fixed inset-0 overflow-y-auto z-50">
    <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
      <div x-show="showCreateModal || showEditModal" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="absolute inset-0 bg-gray-500 bg-opacity-75 transition-opacity z-40"></div>

      <div x-show="showCreateModal || showEditModal" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" class="inline-block align-bottom bg-white dark:bg-gray-800 rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full relative z-50">
        <div class="bg-white dark:bg-gray-800 px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
          <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white mb-4" x-text="showCreateModal ? '새 리스너 생성' : '리스너 수정'"></h3>

          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">카테고리</label>
              <select x-model="currentListener.category_name" :disabled="showEditModal" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white disabled:opacity-50">
                <option value="">카테고리 선택</option>
                <template x-for="category in categories" :key="category.category_name">
                  <option :value="category.category_name" x-text="category.category_name"></option>
                </template>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">설명</label>
              <textarea x-model="currentListener.description" rows="3" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white" placeholder="리스너에 대한 설명을 입력하세요"></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">상태</label>
              <div class="flex items-center">
                <input x-model="currentListener.is_active" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                <label class="ml-2 block text-sm text-gray-900 dark:text-white">
                  활성화
                </label>
              </div>
            </div>
          </div>
        </div>
        <div class="bg-gray-50 dark:bg-gray-900 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
          <button @click="saveListener" type="button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm">
            저장
          </button>
          <button @click="closeModal" type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 dark:border-gray-600 shadow-sm px-4 py-2 bg-white dark:bg-gray-800 text-base font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
            취소
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 상세 보기 모달 -->
  <div x-show="showViewModal" x-cloak class="fixed inset-0 overflow-y-auto z-50">
    <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
      <div x-show="showViewModal" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="absolute inset-0 bg-gray-500 bg-opacity-75 transition-opacity z-40"></div>

      <div x-show="showViewModal" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" class="inline-block align-bottom bg-white dark:bg-gray-800 rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full relative z-50">
        <div class="bg-white dark:bg-gray-800 px-4 pt-5 pb-4 sm:p-6">
          <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white mb-4">리스너 상세 정보</h3>

          <div class="space-y-4">
            <div>
              <p class="text-sm font-medium text-gray-500 dark:text-gray-400">리스너 ID</p>
              <p class="mt-1 text-sm text-gray-900 dark:text-white font-mono" x-text="viewingListener?.listener_id"></p>
            </div>
            <div>
              <p class="text-sm font-medium text-gray-500 dark:text-gray-400">카테고리</p>
              <p class="mt-1 text-sm text-gray-900 dark:text-white" x-text="viewingListener?.category_name"></p>
            </div>
            <div>
              <p class="text-sm font-medium text-gray-500 dark:text-gray-400">설명</p>
              <p class="mt-1 text-sm text-gray-900 dark:text-white" x-text="viewingListener?.description || '설명 없음'"></p>
            </div>
            <div>
              <p class="text-sm font-medium text-gray-500 dark:text-gray-400">상태</p>
              <p class="mt-1">
                <span x-show="viewingListener?.is_active" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200">활성</span>
                <span x-show="!viewingListener?.is_active" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-300">비활성</span>
              </p>
            </div>
            <div>
              <p class="text-sm font-medium text-gray-500 dark:text-gray-400">생성일</p>
              <p class="mt-1 text-sm text-gray-900 dark:text-white" x-text="window.formatDate(viewingListener?.created_at)"></p>
            </div>
          </div>
        </div>
        <div class="bg-gray-50 dark:bg-gray-900 px-4 py-3 sm:px-6">
          <button @click="showViewModal = false" type="button" class="w-full inline-flex justify-center rounded-md border border-gray-300 dark:border-gray-600 shadow-sm px-4 py-2 bg-white dark:bg-gray-800 text-base font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:text-sm">
            닫기
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function listenersData(initialOrgId) {
    const orgId = initialOrgId;

    return {
      listeners: [],
      filteredListeners: [],
      categories: [],
      filters: {
        search: '',
        status: '',
        category: ''
      },
      showCreateModal: false,
      showEditModal: false,
      showViewModal: false,
      viewingListener: null,
      currentListener: {
        category_name: '',
        description: '',
        is_active: true
      },

      init() {
        this.loadListeners();
        this.loadCategories();
      },

      async loadListeners() {
        try {
          const response = await apiCall(`/api/manage/listeners?organization=${orgId}`);
          if (response.success) {
            this.listeners = response.data || [];
            this.applyFilters();
          }
        } catch (error) {
          console.error('Failed to load listeners:', error);
          showToast('리스너 목록을 불러오는데 실패했습니다', 'error');
        }
      },

      async loadCategories() {
        try {
          const response = await apiCall(`/api/manage/categories?organization=${orgId}`);
          if (response.success) {
            this.categories = response.categories || [];
          }
        } catch (error) {
          console.error('Failed to load categories:', error);
        }
      },

      applyFilters() {
        let filtered = [...this.listeners];

        // 검색 필터
        if (this.filters.search) {
          filtered = filtered.filter(l =>
            l.category_name.toLowerCase().includes(this.filters.search.toLowerCase()) ||
            (l.description && l.description.toLowerCase().includes(this.filters.search.toLowerCase()))
          );
        }

        // 상태 필터
        if (this.filters.status === 'active') {
          filtered = filtered.filter(l => l.is_active);
        } else if (this.filters.status === 'inactive') {
          filtered = filtered.filter(l => !l.is_active);
        }

        // 카테고리 필터
        if (this.filters.category) {
          filtered = filtered.filter(l => l.category_name === this.filters.category);
        }

        this.filteredListeners = filtered;
      },

      viewListener(listener) {
        this.viewingListener = listener;
        this.showViewModal = true;
      },

      editListener(listener) {
        this.currentListener = {
          listener_id: listener.listener_id,
          category_name: listener.category_name,
          description: listener.description || '',
          is_active: listener.is_active
        };
        this.showEditModal = true;
      },

      async toggleListenerStatus(listener) {
        try {
          const response = await apiCall(`/api/manage/listeners/${listener.listener_id}?organization=${orgId}`, {
            method: 'PUT',
            body: JSON.stringify({
              is_active: !listener.is_active
            })
          });

          if (response.success) {
            listener.is_active = !listener.is_active;
            showToast('리스너 상태가 변경되었습니다', 'success');
          } else {
            showToast(response.error || '상태 변경에 실패했습니다', 'error');
          }
        } catch (error) {
          console.error('Failed to toggle listener status:', error);
          showToast('상태 변경에 실패했습니다', 'error');
        }
      },

      async deleteListener(listener) {
        if (!confirm(`정말로 '${listener.category_name}' 리스너를 삭제하시겠습니까?`)) {
          return;
        }

        try {
          const response = await apiCall(`/api/manage/listeners/${listener.listener_id}?organization=${orgId}`, {
            method: 'DELETE'
          });

          if (response.success) {
            showToast('리스너가 삭제되었습니다', 'success');
            this.loadListeners();
          } else {
            showToast(response.error || '리스너 삭제에 실패했습니다', 'error');
          }
        } catch (error) {
          console.error('Failed to delete listener:', error);
          showToast('리스너 삭제에 실패했습니다', 'error');
        }
      },

      async saveListener() {
        // 유효성 검사
        if (!this.currentListener.category_name) {
          showToast('카테고리를 선택하세요', 'error');
          return;
        }

        try {
          const method = this.showCreateModal ? 'POST' : 'PUT';
          const url = this.showCreateModal ?
            `/api/manage/listeners?organization=${orgId}` :
            `/api/manage/listeners/${this.currentListener.listener_id}?organization=${orgId}`;

          const response = await apiCall(url, {
            method: method,
            body: JSON.stringify({
              category_name: this.currentListener.category_name,
              description: this.currentListener.description,
              is_active: this.currentListener.is_active
            })
          });

          if (response.success) {
            showToast(this.showCreateModal ? '리스너가 생성되었습니다' : '리스너가 수정되었습니다', 'success');
            this.closeModal();
            this.loadListeners();
          } else {
            showToast(response.error || '저장에 실패했습니다', 'error');
          }
        } catch (error) {
          console.error('Failed to save listener:', error);
          showToast('저장에 실패했습니다', 'error');
        }
      },

      closeModal() {
        this.showCreateModal = false;
        this.showEditModal = false;
        this.currentListener = {
          category_name: '',
          description: '',
          is_active: true
        };
      }
    }
  }
</script>

{{template "footer" .}}
