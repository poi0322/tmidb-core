<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <script defer src="/static/js/tailwindcss.js"></script>
  <script defer src="/static/js/alpine.min.js"></script>
  <script src="/static/js/common.js"></script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full space-y-8 p-8">
    <!-- 로고 및 제목 -->
    <div class="text-center">
      <div class="mx-auto w-16 h-16 bg-blue-600 rounded-lg flex items-center justify-center mb-4">
        <span class="text-white font-bold text-2xl">T</span>
      </div>
      <h2 class="text-3xl font-bold text-gray-900 dark:text-white">tmiDB</h2>
      <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">계정에 로그인하세요</p>
    </div>

    <!-- 로그인 폼 -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6" x-data="loginForm()">
      <form @submit.prevent="submitLogin()">
        <div class="space-y-4">
          <!-- 사용자명 -->
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              사용자명
            </label>
            <input x-model="form.username" type="text" id="username" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white" placeholder="사용자명을 입력하세요">
          </div>

          <!-- 비밀번호 -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              비밀번호
            </label>
            <input x-model="form.password" type="password" id="password" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white" placeholder="비밀번호를 입력하세요">
          </div>
        </div>

        <!-- 에러 메시지 -->
        <div x-show="error" class="mt-4 p-3 bg-red-100 dark:bg-red-900 border border-red-400 dark:border-red-600 text-red-700 dark:text-red-200 rounded-md text-sm" x-text="error"></div>

        <!-- 로그인 버튼 -->
        <div class="mt-6">
          <button type="submit" :disabled="loading" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
            <span x-show="!loading">로그인</span>
            <span x-show="loading" class="flex items-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              로그인 중...
            </span>
          </button>
        </div>
      </form>
    </div>

    <!-- 시스템 정보 -->
    <div class="text-center text-xs text-gray-500 dark:text-gray-400">
      <p>tmiDB v1.0 - Target-Speaker-Listener Database</p>
    </div>
  </div>

  <script>
    // 이미 로그인된 경우 자동 리디렉션 (api_token + 세션 쿠키)
    document.addEventListener('DOMContentLoaded', function() {
      if (localStorage.getItem('api_token')) {
        // 세션 쿠키가 있으면 바로 대시보드로 이동 (쿠키 이름은 Fiber 기본값: "fiber_session")
        if (document.cookie.split(';').some((c) => c.trim().startsWith('fiber_session='))) {
          window.location.href = '/dashboard';
        }
      }
    });

    function loginForm() {
      return {
        loading: false,
        error: '',
        form: {
          username: '',
          password: ''
        },

        async submitLogin() {
          this.loading = true;
          this.error = '';

          try {
            const response = await fetch('/login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(this.form)
            });

            const data = await response.json();

            if (response.ok) {
              // 서버 응답에 토큰이 있으면 localStorage에 저장
              if (data.token) {
                localStorage.setItem('api_token', data.token);
              } else if (data.access_token) {
                localStorage.setItem('api_token', data.access_token);
              }
              // 반드시 JS에서 리디렉션 (서버 리디렉션 금지)
              window.location.href = '/dashboard';
            } else {
              this.error = data.error || '로그인에 실패했습니다.';
            }
          } catch (error) {
            console.error('Login error:', error);
            this.error = '네트워크 오류가 발생했습니다.';
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>

</html>
