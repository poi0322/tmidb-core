{{template "header" .}}

<div x-data="filesData()" x-init="init()" class="space-y-6">
  <h2 class="text-2xl font-bold text-gray-900 dark:text-white">파일 관리</h2>
  <p class="text-gray-600 dark:text-gray-400">업로드된 파일들을 관리하세요.</p>

  <!-- 파일 목록 -->
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-6">
    <div x-show="loading" class="text-center py-8">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
      <p class="mt-2 text-gray-600 dark:text-gray-400">로딩 중...</p>
    </div>

    <div x-show="!loading">
      <div class="mb-4 flex items-center justify-between">
        <input x-model="searchTerm" @input="filterFiles()" type="text" placeholder="파일 검색..." class="w-full max-w-md px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
        <button @click="showUploadForm = true" class="ml-4 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
          파일 업로드
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="file in filteredFiles" :key="file.file_id">
          <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4 hover:shadow-md transition-shadow">
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white" x-text="file.filename"></h3>
              <span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-200" x-text="file.file_type"></span>
            </div>
            <div class="space-y-2 text-sm">
              <p class="text-gray-600 dark:text-gray-400">
                <span class="font-medium">크기:</span>
                <span x-text="window.formatFileSize(file.file_size)"></span>
              </p>
              <p class="text-gray-600 dark:text-gray-400">
                <span class="font-medium">카테고리:</span>
                <span x-text="file.category || '없음'"></span>
              </p>
              <p class="text-xs text-gray-500 dark:text-gray-400" x-text="window.formatDate(file.uploaded_at)"></p>
            </div>
            <div class="mt-4 flex space-x-2">
              <button @click="downloadFile(file.file_id)" class="flex-1 px-3 py-1 text-sm bg-green-600 text-white rounded hover:bg-green-700">
                다운로드
              </button>
              <button @click="deleteFile(file.file_id)" class="px-3 py-1 text-sm text-red-600 border border-red-300 rounded hover:bg-red-50 dark:border-red-600 dark:text-red-400 dark:hover:bg-red-900/20">
                삭제
              </button>
            </div>
          </div>
        </template>
      </div>

      <div x-show="filteredFiles.length === 0" class="text-center py-8">
        <p class="text-gray-500 dark:text-gray-400">파일이 없습니다.</p>
      </div>
    </div>
  </div>

  <!-- 파일 업로드 폼 (모달) -->
  <div x-show="showUploadForm" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50" @click="showUploadForm = false">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white dark:bg-gray-800" @click.stop>
      <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-4">파일 업로드</h3>
      <form @submit.prevent="uploadFile()">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">파일 선택</label>
          <input type="file" @change="handleFileSelect($event)" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">카테고리 (선택사항)</label>
          <input x-model="uploadForm.category" type="text" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
        </div>
        <div class="flex justify-end space-x-2">
          <button type="button" @click="showUploadForm = false" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400">
            취소
          </button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
            업로드
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function filesData() {
    const orgId = new URLSearchParams(window.location.search).get('org_id') || '{{.Organization.OrgID}}' || 'default';
    return {
      loading: false,
      showUploadForm: false,
      files: [],
      filteredFiles: [],
      searchTerm: '',
      uploadForm: {
        category: ''
      },
      selectedFile: null,

      async init() {
        await this.loadFiles();
      },

      async loadFiles() {
        this.loading = true;
        try {
          const response = await apiCall('/api/manage/files?org_id=' + orgId);
          this.files = response.data.files || [];
          this.filterFiles();
        } catch (error) {
          console.error('Failed to load files:', error);
        } finally {
          this.loading = false;
        }
      },

      filterFiles() {
        if (!this.searchTerm) {
          this.filteredFiles = this.files;
        } else {
          this.filteredFiles = this.files.filter(file =>
            file.filename.toLowerCase().includes(this.searchTerm.toLowerCase()) ||
            (file.category && file.category.toLowerCase().includes(this.searchTerm.toLowerCase()))
          );
        }
      },

      handleFileSelect(event) {
        this.selectedFile = event.target.files[0];
      },

      async uploadFile() {
        if (!this.selectedFile) return;

        const formData = new FormData();
        formData.append('file', this.selectedFile);
        formData.append('category', this.uploadForm.category);

        try {
          await apiCall('/api/manage/files?org_id=' + orgId, 'POST', formData);
          await this.loadFiles();
          this.showUploadForm = false;
          this.resetForm();
        } catch (error) {
          console.error('Failed to upload file:', error);
        }
      },

      async downloadFile(fileId) {
        try {
          const response = await fetch(`/api/manage/files/${fileId}/download?org_id=${orgId}`);
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = '';
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);
        } catch (error) {
          console.error('Failed to download file:', error);
        }
      },

      async deleteFile(fileId) {
        if (confirm('정말로 이 파일을 삭제하시겠습니까?')) {
          try {
            await apiCall(`/api/manage/files/${fileId}?org_id=${orgId}`, 'DELETE');
            await this.loadFiles();
          } catch (error) {
            console.error('Failed to delete file:', error);
          }
        }
      },

      resetForm() {
        this.uploadForm = {
          category: ''
        };
        this.selectedFile = null;
      },
    }
  }
</script>

{{template "footer" .}}
