# .air.toml - Air configuration file for tmidb-core development

# Working directory
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
# Command to build the main application binary.
# We build the supervisor, which in turn manages all other processes.
cmd = "./scripts/build.sh supervisor"

# The binary to run after building.
# In development mode, binaries are built to ./bin directory
bin = "./bin/tmidb-supervisor"

# Watch these file extensions.
include_ext = ["go", "tpl", "tmpl", "html"]

# Ignore these directories.
exclude_dir = ["assets", "tmp", "vendor", "testdata", "docker-run", "todoList"]

# Trigger a build on new file creation.
include_file = []

# Delay in milliseconds before restarting the process.
delay = 1000

[log]
# Show log time
time = false

[misc]
# Delete tmp directory on exit
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true
